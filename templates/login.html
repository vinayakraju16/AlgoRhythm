<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hospital Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white max-w-md w-full p-6 rounded-xl shadow-xl">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">🏥 Staff Login</h2>
    {% if error %}
    <p class="mb-4 text-center text-red-600 font-semibold">{{ error }}</p>
    {% endif %}
    <form id="loginForm" method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}" />
      <input id="username" name="username" type="text" placeholder="Username" class="w-full p-2 border rounded" required autocomplete="username" />
      <input id="password" name="password" type="password" placeholder="Password" class="w-full p-2 border rounded" required autocomplete="current-password" />
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
    </form>
  </div>
</body>
</html>
